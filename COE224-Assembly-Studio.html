.code

    ; Read the lowest byte (78h)
    mov al, BYTE PTR val1

    call DumpRegs
    exit
main ENDP
END main

    total DWORD 0

.code
main PROC
    mov esi, OFFSET array
    mov ecx, 5
    mov eax, 0

L1:
    add eax, [esi]
    add esi, TYPE array
    loop L1

    mov total, eax
    call WriteInt
    call Crlf
    exit
main ENDP
END main

.code
main PROC
    ; Unsigned carry: 0FFFFFFFFh + 1 -> CF=1, ZF=1
    mov eax, 0FFFFFFFFh
    add eax, 1

    ; Signed overflow: 7FFFFFFFh + 1 -> OF=1, SF=1
    mov ebx, 7FFFFFFFh
    add ebx, 1

    call DumpRegs
    exit
main ENDP
END main

.code
main PROC
    mov eax, 1
    mov ebx, 2
    mov ecx, 3

    ; Push onto stack (ESP decreases)
    push eax
    push ebx
    push ecx

    ; Pop in reverse order
    pop eax   ; gets 3
    pop ebx   ; gets 2
    pop ecx   ; gets 1

    call DumpRegs
    exit
main ENDP
END main

    mov ebx, 10
    mov ecx, 15
    call SumThree
    call DumpRegs
    exit

    add eax, ebx
    add eax, ecx
    ret

END main

    cmp eax, v2
    jge GreaterOrEqual

    mov eax, v2
    jmp Done

    ; v1 is larger
    mov eax, v1

    call WriteInt
    call Crlf
    exit
main ENDP
END main

.code

    shl eax, 3      ; eax = 12 * 8 = 96
    shl ebx, 1      ; ebx = 12 * 2 = 24

    call WriteInt
    call Crlf
    exit

    mov edx, 0      ; Clear high dividend
    mov ebx, 6
    div ebx         ; Quotient in EAX (33), Remainder in EDX (2)

    call DumpRegs
    exit
